name: Mise à jour du Radar

on:
  schedule:
    # 22 h 20 UTC du lundi au vendredi = 17 h 20 à Montréal (heure normale), 18 h 20 l'été.
    - cron: '20 22 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symboles à mettre à jour (vide = tous)"
        required: false
        default: ""
      force13f:
        description: "Relire tout de suite les déclarations 13F (oui = oui)"
        required: false
        default: ""
      discover:
        description: "Lancer tout de suite le balayage S&P 500 / TSX 60 (oui = oui)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les bibliothèques
        run: pip install -r requirements.txt
      - name: Mettre à jour les données
        env:
          RADAR_PASSWORD: ${{ secrets.RADAR_PASSWORD }}
          FORCE_13F: ${{ github.event.inputs.force13f }}
          FORCE_DISCOVER: ${{ github.event.inputs.discover }}
        run: python scripts/update.py ${{ github.event.inputs.symbols }}
      - name: Enregistrer les changements
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
          # Si la page a enregistré quelque chose pendant la mise à jour, sa version est gardée.
          git pull --rebase -X ours origin main
          git push
      - name: Notifier (application GitHub ou courriel)
        if: hashFiles('.notify.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create radar --color 1f4fd1 --description "Notifications du Radar" 2>/dev/null || true
          for n in $(gh issue list --label radar --state open --json number -q '.[].number'); do gh issue close "$n"; done
          {
            echo "@999FlaminGoat, voici ce qui a changé aujourd'hui :"
            echo
            cat .notify.md
            echo
            echo "👉 Ouvre ton radar : https://999flamingoat.github.io/radar-boursier/"
            echo
            echo "_Le détail reste dans ta page, déverrouillée avec ton mot de passe._"
          } > body.md
          gh issue create --title "📡 Radar du $(date +%Y-%m-%d)" --body-file body.md --label radar
